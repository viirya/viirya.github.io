<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Liang-Chi Hsieh</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Liang-Chi Hsieh — software engineer.">
  <meta name="author" content="Liang-Chi Hsieh">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #6b7280;
    }

    html { font-size: 16px; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;

      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .bio {
      color: var(--muted);
      margin-top: 0.375rem;
    }

    nav {
      margin-top: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      font-size: 0.875rem;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }

    nav a:hover { color: var(--text); }
  </style>
</head>
<body>
  <main>
    <h1>Liang-Chi Hsieh</h1>
    <p class="bio">Software engineer.</p>
    <nav>
      <a href="https://github.com/viirya">GitHub</a>
      <a href="https://www.linkedin.com/in/liang-chi-hsieh-a7904568/">LinkedIn</a>
      <a href="https://scholar.google.com.tw/citations?hl=zh-TW&amp;user=jEVAXJUAAAAJ">Scholar</a>
    </nav>
  </main>
</body>
</html>
